<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Thin silver ring -->
  <circle cx="32" cy="32" r="26" stroke="#c0c8d0" stroke-width="1.8" fill="none"/>
  <!-- Blue glowing core -->
  <circle cx="32" cy="32" r="11" fill="url(#core)"/>
  <!-- Thin orbit arc -->
  <path d="M12 44 A28 28 0 0 1 50 20" stroke="#b8c0c8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Small endpoint dot -->
  <circle cx="12" cy="44" r="2.4" fill="#d0d8e0"/>
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00e0ff"/>
      <stop offset="100%" stop-color="#0090cc"/>
    </radialGradient>
  </defs>
</svg>